name: Build Vortex Crypto App APK (Zero-Storage GitHub Release)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_and_release:
    name: Analyze, Test & Publish Universal APK to Releases
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run static analysis
        run: flutter analyze --fatal-infos

      - name: Run unit & widget tests
        run: flutter test

      - name: Generate Android project & permissions
        run: |
          flutter create --platforms=android --org com.vortex.crypto --project-name vortex_crypto_app .
          rm -f test/widget_test.dart
          python3 -c '
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r") as f:
              txt = f.read()
          if "android.permission.INTERNET" not in txt:
              txt = txt.replace("<application", "<uses-permission android:name=\"android.permission.INTERNET\"/>\n    <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\"/>\n    <application")
          txt = txt.replace("android:label=\"vortex_crypto_app\"", "android:label=\"Vortex Coin\"")
          with open(path, "w") as f:
              f.write(txt)
          '

      - name: Build Universal Release APK
        run: |
          mkdir -p build/symbols
          flutter build apk --release --obfuscate --split-debug-info=build/symbols
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Vortex_Crypto_App.apk

      - name: Publish Direct GitHub Release (Zero Actions Storage)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.0.0-latest
          name: "Vortex Coin (VTX) — Universal Android Release APK"
          body: |
            ## Vortex Coin (VTX) — Crypto Mining, Watch Ads & 1B BEP-20 Airdrop App

            ### Direct APK Download (Zero Actions Storage)
            - **Universal Android APK:** `Vortex_Crypto_App.apk` (works on ARM64, ARMv7 & x86_64 devices)

            ### Pages Included
            - **Home:** 24h Cloud Mining Node, Tap-to-Earn Core, 2x Speed Boost Ads, Earning Breakdown
            - **Airdrop:** 1,000,000,000 VTX Pool Tracker, Multiplier Checklist, Launch Roadmap & Tokenomics
            - **Offer:** Rewarded Video Ad Center, 7-Day Streak, Social & Partner Tasks
            - **Refer:** 2-Tier Referral Program (`15%` + `5%`), Milestones & Team List
            - **Wallet:** BEP-20 (`0x...`) Address Binding & Verified Reward Ledger
            - **Profile:** Anti-Bot Readiness, Launch Whitepaper Blueprint & Security Settings
          files: |
            build/app/outputs/flutter-apk/Vortex_Crypto_App.apk
